name: pages

# Publishes bounce/public as a static site. The point is the zero-backend demo:
# `?demo=1` answers all three endpoints in-page, so a visitor needs no proxy, no
# key and no model -- and navigation is deterministic, so a maze still gets
# solved. See docs/deployment.md.
#
# Demo mode is opt-in and never engages automatically, so a visitor must add
# ?demo=1 to the URL or the page will (correctly) report the proxy unreachable.

on:
  push:
    branches: [main, master]
    paths:
      - 'bounce/public/**'
      - '.github/workflows/pages.yml'
  # Redeploy on demand. Worth keeping even with the path filter above: the Pages
  # `main` branch can also be configured manually, and a site that only builds on
  # a matching path is a site that silently stops updating the moment someone
  # enables Pages from the Settings tab and redeploys from a branch that did not
  # touch bounce/public.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer commit cancels an in-flight one rather
# than racing it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # public/ is the static server's document root, so it is already the exact
      # tree to publish. No bundler step: the import map in index.html resolves
      # the bare specifiers, and Rapier's -compat build inlines its WASM as
      # base64 so there is no second request to wire up.
      - name: Verify the demo path is not broken before publishing
        working-directory: bounce
        run: |
                # Every module the page imports, not just the two entry points. A syntax
                # error in any of them leaves a deployed site that loads a blank canvas
                # and a console message no visitor will read — the failure mode that
                # looks most like "the demo just doesn't work".
                for f in public/*.js; do node --check "$f"; done
                test -f public/index.html || { echo "no index.html"; exit 1; }

                # Pages serves this site from https://<user>.github.io/Bounce/, not from
                # the domain root. A leading-slash asset path therefore 404s, and it is
                # the single most common way a GitHub Pages site renders blank while
                # working perfectly on localhost — so it is checked here rather than
                # discovered by a visitor. Localhost and CDNs are both fine; only
                # root-relative paths are the problem.
                if grep -nE '(src|href)="/' public/index.html; then
                  echo "index.html has a root-relative asset path; Pages serves from /Bounce/"
                  exit 1
                fi

                # The import map must still resolve every bare specifier the page uses.
                # A bare specifier with no import-map entry is a bare module error at
                # runtime, which shows a visitor a black canvas and nothing else.
                for spec in three @dimforge/rapier3d-compat; do
                  grep -q "\"$spec\"" public/index.html || { echo "import map missing $spec"; exit 1; }
                done

                # Personality determinism is the one invariant the whole demo rests on:
                # a shared URL has to reproduce the same run.
                node test/personality.test.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: bounce/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4