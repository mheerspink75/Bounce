name: tests

# `npm test` is the headless + server suite: Node only, no browser, no network,
# no API key. That is the point of running it here -- the browser and live-model
# suites need hardware and a key, so they stay local. See docs/testing.md.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bounce

    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: bounce/package-lock.json

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Syntax check every source file
        run: |
          find public server scripts test -name '*.js' -o -name '*.mjs' \
            | xargs -n1 node --check

      - name: Headless + server tests
        run: npm test

  links:
      # The README links into nine docs/ files by anchor, and five of those pages
      # carry Mermaid diagrams. A renamed heading breaks the links silently; a
      # diagram that does not parse renders as an error box on GitHub. Nothing
      # else in CI would notice either, so both are checked here.
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: bounce
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: '22'
            cache: npm
            cache-dependency-path: bounce/package-lock.json
        - run: npm install --no-audit --no-fund
        - name: Verify every relative link and anchor resolves
          run: node scripts/check-links.mjs
        - name: Verify every Mermaid diagram parses
          run: node scripts/check-mermaid.mjs