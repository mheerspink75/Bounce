<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bounce — step 1 (physics only)</title>

<!--
  Bare-specifier import map so the modules below can `import * as THREE from 'three'`
  instead of hardcoding CDN URLs. This also means the same source works unchanged
  under a bundler later (see README §8, open question 5).

  Versions are pinned. Rapier is the "-compat" build specifically: it inlines the
  WASM as base64, so there is no second request to wire up and no MIME-type config.
-->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
    "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.21.0/dist/rapier.mjs"
  }
}
</script>

<style>
  html, body { margin: 0; height: 100%; background: #0d0f12; overflow: hidden; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 10px; left: 10px;
    font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
    color: #c8d0da; background: rgba(13,15,18,.72);
    padding: 8px 10px; border-radius: 6px; white-space: pre;
    pointer-events: none;
  }
  /* The thoughts panel: what the model actually emitted, next to what was
     applied. Lives in the empty space on the right so it never covers the
     maze, and is hidden by default on narrow viewports where it would. */
  #thoughts {
    position: fixed; top: 10px; right: 10px; width: 330px;
    max-height: calc(100vh - 20px); overflow-y: auto; overscroll-behavior: contain;
    font: 11px/1.5 ui-monospace, Menlo, Consolas, monospace;
    color: #7d8b9c; background: rgba(13,15,18,.66);
    border: 1px solid #1e252e; border-radius: 6px;
    padding: 8px 10px;
  }
  #thoughts h2 {
    margin: 0 0 6px; font: 10px/1.4 inherit;
    text-transform: uppercase; letter-spacing: .08em; color: #5d6a7a;
  }
  #thoughts .t-entry { border-top: 1px solid #1a2028; padding: 6px 0 2px; }
  #thoughts .t-entry:first-of-type { border-top: 0; }
  #thoughts .t-meta { color: #55626f; font-size: 10px; margin-bottom: 2px; }
  #thoughts .t-said {
    color: #b9c6d4; background: #12171e; border-left: 2px solid #2f3d4d;
    padding: 4px 6px; border-radius: 0 3px 3px 0;
    white-space: pre-wrap; word-break: break-word; margin: 0;
  }
  #thoughts .t-said.is-clamped { border-left-color: #7a5a2a; }
  /* Scratch work, visually distinct from the answer: reasoning models produce a
     lot of it, and it must never be mistaken for the intent that was applied. */
  #thoughts .t-reason {
    color: #8d9aa8; background: #0f1319; border-left: 2px solid #4a4230;
    padding: 4px 6px; border-radius: 0 3px 3px 0;
    white-space: pre-wrap; word-break: break-word; margin: 3px 0 0;
  }
  #thoughts .t-reason .t-tag {
    display: block; color: #7d6f4a; font-size: 9px;
    text-transform: uppercase; letter-spacing: .07em; margin-bottom: 2px;
  }
  #thoughts .t-why { color: #66727f; margin: 3px 0 0; }
  #thoughts .t-why b { color: #9a8a5a; font-weight: normal; }
  #thoughts .t-none { color: #4d5865; }
  /* Toggle lives outside the panel so it stays clickable while the body is not. */
  #thoughtsToggle {
    position: fixed; top: 10px; right: 10px; z-index: 2;
    font: 10px/1 ui-monospace, Menlo, Consolas, monospace;
    color: #5d6a7a; background: rgba(13,15,18,.8);
    border: 1px solid #1e252e; border-radius: 4px;
    padding: 5px 7px; cursor: pointer; user-select: none;
  }
  #thoughtsToggle:hover { color: #9fb0c2; border-color: #2b3542; }
  body.thoughts-open #thoughts { display: block; }
  body:not(.thoughts-open) #thoughts { display: none; }
  body.thoughts-open #thoughtsToggle { right: 350px; }
  @media (max-width: 900px) { body.thoughts-open #thoughts { display: none; } }
  #err {
    position: fixed; inset: 20px; display: none;
    font: 13px/1.5 ui-monospace, monospace; color: #ff8a7a;
    background: #1a0f0f; border: 1px solid #5a2a24; border-radius: 8px;
    padding: 16px; overflow: auto; white-space: pre-wrap;
  }
</style>
</head>
<body>
  <div id="hud">initialising…</div>
  <div id="thoughtsToggle" role="button" tabindex="0" title="Show what the model is emitting">thoughts</div>
  <div id="thoughts" hidden></div>
  <div id="err"></div>
  <script>
    // Toggle before the module loads, so the panel's state is not a visible flash
    // on reload, and so it works even if the page has not booted.
    (() => {
      const KEY = 'bounce.thoughts';
      const open = () => document.body.classList.contains('thoughts-open');
      let stored = null;
      try { stored = localStorage.getItem(KEY); } catch { /* private mode */ }
      if (stored !== null) document.body.classList.toggle('thoughts-open', stored === '1');
      addEventListener('DOMContentLoaded', () => {
        const el = document.getElementById('thoughtsToggle');
        const flip = () => {
          const next = !open();
          document.body.classList.toggle('thoughts-open', next);
          try { localStorage.setItem(KEY, next ? '1' : '0'); } catch { /* ignore */ }
        };
        el.addEventListener('click', flip);
        el.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); }
        });
        // The panel is only rendered while it is open, so opening it has to ask
        // for a draw. A custom event rather than an import, because this script
        // runs before the module does.
        el.addEventListener('click', () => {
          setTimeout(() => dispatchEvent(new CustomEvent('bounce:thoughts')), 0);
        });
      });
    })();
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
